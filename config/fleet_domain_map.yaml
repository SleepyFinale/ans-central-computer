fleet_domain_map:
  version: 1
  # ROS domain of every central process (Zenoh bridge, map_merge, explorer,
  # RViz). All robots' namespaced topics arrive here through Zenoh.
  central_domain_id: 50
  # Each robot's own loopback-only domain (reference only). The robot side
  # sets it in ~/turtlebot3/scripts/env/ros_domain_profile.bash and
  # scripts/comms/start_zenoh_robot.sh; keep those in step if this changes.
  robot_domain_ids:
    blinky: 05
    pinky: 22
    inky: 19
    clyde: 80
